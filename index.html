<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site pour ma Laety ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background"></div>
    <div class="overlay"></div>
    <div id="stars"></div>

    <main class="container">

        <header class="hero">
            <h1>Site pour ma Laety ❤️</h1>
            <p>Quelques mélodies, beaucoup d'émotions... ✨</p>
        </header>

        <section class="music-section">
            <h2>🎵 Mes chansons pour toi</h2>
            <div id="playlist"></div>
        </section>

        <section class="lyrics-section">
            <h2>💖 Paroles de la chanson</h2>

            <div id="songTitle" class="song-title">
                Choisis une chanson
            </div>

            <div id="lyrics">
                <p class="loading">
                    Sélectionne une chanson pour découvrir ses paroles.
                </p>
            </div>
        </section>

    </main>

    <div class="player">
        <div class="player-info">
            <strong id="playerTitle">Aucune chanson</strong>
            <span id="playerArtist">Choisis une musique</span>
        </div>

        <audio id="audio" controls preload="metadata"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
